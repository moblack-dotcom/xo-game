<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XO — Tic Tac Toe</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05050f;
    --purple: #8b5cf6;
    --blue: #3b82f6;
    --purple-glow: rgba(139, 92, 246, 0.5);
    --blue-glow: rgba(59, 130, 246, 0.5);
    --text: #f0f0ff;
    --muted: #6b7280;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Background */
  .bg-effects {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .bg-effects::before {
    content: '';
    position: absolute;
    top: -20%;
    right: -20%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%);
    animation: float1 8s ease-in-out infinite alternate;
  }
  .bg-effects::after {
    content: '';
    position: absolute;
    bottom: -20%;
    left: -20%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%);
    animation: float2 10s ease-in-out infinite alternate;
  }
  @keyframes float1 { from { transform: translate(0,0) scale(1); } to { transform: translate(-50px, 50px) scale(1.2); } }
  @keyframes float2 { from { transform: translate(0,0) scale(1); } to { transform: translate(50px, -50px) scale(1.2); } }

  /* Grid pattern */
  .grid-pattern {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(139,92,246,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,92,246,0.04) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 40px 24px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
  }

  /* Header */
  .badge {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--purple);
    text-transform: uppercase;
    border: 1px solid rgba(139,92,246,0.3);
    padding: 6px 16px;
    border-radius: 100px;
    background: rgba(139,92,246,0.08);
    animation: fadeIn 0.6s ease forwards;
  }

  .logo {
    text-align: center;
    animation: fadeIn 0.8s ease forwards;
  }

  .logo-xo {
    font-size: 90px;
    font-weight: 900;
    line-height: 1;
    background: linear-gradient(135deg, var(--purple) 0%, #a78bfa 40%, var(--blue) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 40px rgba(139,92,246,0.4));
    letter-spacing: 8px;
  }

  .logo-sub {
    font-size: 13px;
    letter-spacing: 6px;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* 3D Board Preview */
  .board-preview {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 200px;
    animation: fadeIn 1s ease forwards, boardFloat 4s ease-in-out infinite;
    transform-style: preserve-3d;
    perspective: 500px;
  }

  @keyframes boardFloat {
    0%, 100% { transform: rotateX(8deg) rotateY(-5deg) translateY(0); }
    50% { transform: rotateX(8deg) rotateY(-5deg) translateY(-10px); }
  }

  .cell-preview {
    aspect-ratio: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 900;
    backdrop-filter: blur(10px);
  }

  .cell-preview.x { color: var(--purple); text-shadow: 0 0 20px var(--purple-glow); }
  .cell-preview.o { color: var(--blue); text-shadow: 0 0 20px var(--blue-glow); }
  .cell-preview.empty { color: transparent; }

  /* Description */
  .desc {
    text-align: center;
    animation: fadeIn 1.2s ease forwards;
  }

  .desc h1 {
    font-size: 28px;
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 12px;
  }

  .desc p {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.7;
  }

  /* Features */
  .features {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    animation: fadeIn 1.4s ease forwards;
  }

  .feature {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: var(--muted);
  }

  .feature-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(139,92,246,0.1);
    border: 1px solid rgba(139,92,246,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  /* Stats */
  .stats {
    display: flex;
    gap: 24px;
    animation: fadeIn 1.5s ease forwards;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-size: 24px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--purple), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  /* Buttons */
  .buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    animation: fadeIn 1.6s ease forwards;
  }

  .btn-play {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--purple), var(--blue));
    color: white;
    font-family: 'Tajawal', sans-serif;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 32px rgba(139,92,246,0.4);
    text-decoration: none;
    display: block;
    text-align: center;
  }

  .btn-play:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(139,92,246,0.6);
  }

  .btn-play:active { transform: translateY(0); }

  /* Instagram */
  .insta {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    padding: 8px 16px;
    border-radius: 30px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    color: white;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 18px rgba(220,39,67,0.35);
  }
  .insta:hover { transform: scale(1.05); }

  .credit {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="bg-effects"></div>
<div class="grid-pattern"></div>

<div class="container">

  <div class="badge">CLASSIC GAME</div>

  <div class="logo">
    <div class="logo-xo">X·O</div>
    <div class="logo-sub">Tic Tac Toe</div>
  </div>

  <div class="board-preview">
    <div class="cell-preview x">✕</div>
    <div class="cell-preview o">○</div>
    <div class="cell-preview x">✕</div>
    <div class="cell-preview o">○</div>
    <div class="cell-preview x">✕</div>
    <div class="cell-preview empty"></div>
    <div class="cell-preview empty"></div>
    <div class="cell-preview o">○</div>
    <div class="cell-preview empty"></div>
  </div>

  <div class="desc">
    <h1>العبة الكلاسيكية<br>بأسلوب عصري</h1>
    <p>تحدى الذكاء الاصطناعي واثبت أنك الأفضل</p>
  </div>

  <div class="features">
    <div class="feature">
      <div class="feature-icon">⚡</div>
      <span>سريع وخفيف — يشتغل على أي جهاز</span>
    </div>
    <div class="feature">
      <div class="feature-icon">🤖</div>
      <span>ذكاء اصطناعي بـ 3 مستويات صعوبة</span>
    </div>
    <div class="feature">
      <div class="feature-icon">🏆</div>
      <span>ليدربورد عالمي ونظام نقاط</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num">3</div>
      <div class="stat-label">مستويات</div>
    </div>
    <div class="stat">
      <div class="stat-num">∞</div>
      <div class="stat-label">جولات</div>
    </div>
    <div class="stat">
      <div class="stat-num">🌍</div>
      <div class="stat-label">لاعبين</div>
    </div>
  </div>

  <div class="buttons">
    <a href="xo-game.html" class="btn-play">🎮 العب الآن</a>
    <a href="https://instagram.com/GER" target="_blank" class="insta" style="width:fit-content; margin:0 auto;">

  </div>

</div>

</body>
</html>
